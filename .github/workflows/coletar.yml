name: Coletar e publicar

on:
  schedule:
    - cron: "23 */3 * * *"   # a cada 3 horas (UTC), fora do minuto cheio
  workflow_dispatch:          # botão "Run workflow"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: radar-engenharia
  cancel-in-progress: false

jobs:
  coletar:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Coletar, validar, gerar a página e avisar
        env:
          RADAR_DB: dados/radar.sqlite3
          RADAR_CONTACT: https://github.com/${{ github.repository }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          mkdir -p dados
          python -m app.cloud

      - name: Guardar o banco no repositório
        run: |
          git config user.name "radar-engenharia"
          git config user.email "radar-engenharia@users.noreply.github.com"
          git add -f dados/radar.sqlite3
          if git diff --cached --quiet; then
            echo "Sem mudanças no banco."
          else
            git commit -m "Atualiza dados $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
